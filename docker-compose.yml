version: "3.8"

services:
  sensora-agent:
    build: .
    container_name: sensora_agent
    restart: unless-stopped
    network_mode: "host"

    volumes:
      # Mount the user's config file
      - ./config.ini:/app/config.ini:ro
      # Mount the persistent data volume to /app/data inside the container
      - sensora_agent_data:/app/data

    # --- THIS LINE SETS THE ENVIRONMENT VARIABLE ---
    # It tells the Python app inside the container where to store its database.
    environment:
      - SENSORA_DATA_DIR=/app/data

volumes:
  sensora_agent_data:
