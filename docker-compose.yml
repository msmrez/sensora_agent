services:
  agent:
    build: .
    restart: unless-stopped

    # Map port 8086 on the host's localhost to port 8086 inside the container.
    ports:
      - "127.0.0.1:8086:8086"

    volumes:
      - ./config.ini:/app/config.ini:ro
      - agent_data:/app/data

    environment:
      - SENSORA_DATA_DIR=/app/data

volumes:
  agent_data:
